<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#020611"/>
<title>Game</title>
<style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020611;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #020611;
    }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    #game-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #unity-canvas,
    #gate {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #game-shell {
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 42%, rgba(23, 75, 142, .3), transparent 34%),
        radial-gradient(circle at 18% 20%, rgba(106, 50, 158, .18), transparent 28%),
        #020611;
    }
    @media (min-aspect-ratio: 16/9) {
      #game-shell {
        width: calc(100vh * 16 / 9);
        height: 100vh;
      }
    }
    #unity-canvas {
      display: block;
      border: 0;
      outline: 0;
      touch-action: none;
      visibility: hidden;
    }
    #gate {
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 48%, rgba(23, 87, 178, .28), transparent 30%),
        linear-gradient(150deg, rgba(3, 9, 26, .95), rgba(0, 2, 8, .98));
      transition: opacity .28s ease;
    }
    #gate[hidden] {
      display: none;
    }
    .gate-panel {
      width: min(420px, 88vw);
      text-align: center;
    }
    #status {
      min-height: 24px;
      margin: 0 0 18px;
      color: #dceaff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(120, 180, 255, .5);
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      box-shadow: 0 0 24px rgba(36, 124, 255, .18);
    }
    #progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #168cff, #71e8ff);
      box-shadow: 0 0 14px rgba(78, 211, 255, .7);
      transition: width .15s linear;
    }
    #start-button {
      display: none;
      width: min(280px, 74vw);
      min-height: 64px;
      margin: 0 auto;
      border: 2px solid #8beaff;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(145deg, #075ed0, #0e96dd);
      box-shadow: 0 0 0 5px rgba(40, 137, 255, .16), 0 12px 38px rgba(0, 78, 190, .48);
      font: inherit;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      touch-action: manipulation;
    }
    #start-button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }
    #start-button:active {
      transform: translateY(1px) scale(.99);
    }
    #gate.ready #status,
    #gate.ready #progress-track {
      display: none;
    }
    #gate.ready #start-button {
      display: block;
    }
    #error {
      display: none;
      margin-top: 18px;
      color: #ffb6b6;
      font-size: 14px;
      line-height: 1.45;
    }
    #gate.failed #progress-track,
    #gate.failed #start-button {
      display: none;
    }
    #gate.failed #error {
      display: block;
    }
  </style>
<script>
var CDN        = "";
var DATA_PARTS = 4;
var WASM_PARTS = 7;
var LANG       = "en";

function U(p){ return CDN ? (String(CDN).replace(/\/+$/,"") + "/" + p) : p; }

(function(){
  var LS="ya_player_data", LSS="ya_player_stats";
  function rd(k,f){ try{ return JSON.parse(localStorage.getItem(k)||f); }catch(e){ return JSON.parse(f); } }
  function wr(k,o){ try{ localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }
  var pdata=rd(LS,"{}"), pstats=rd(LSS,"{}");
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  function cb(o,n,a){ try{ if(o&&o.callbacks&&typeof o.callbacks[n]==="function") o.callbacks[n](a); }catch(e){} }

  var yplayer={
    getUniqueID:function(){ return "local-player"; },
    getName:function(){ return "Player"; },
    getPhoto:function(){ return ""; },
    getMode:function(){ return "lite"; },
    getPayingStatus:function(){ return "unknown"; },
    getIDsPerGame:function(){ return Promise.resolve([]); },
    getData:function(){ return Promise.resolve(JSON.parse(JSON.stringify(pdata))); },
    setData:function(d){ pdata=Object.assign(pdata,d||{}); wr(LS,pdata); return Promise.resolve(); },
    getStats:function(){ return Promise.resolve(JSON.parse(JSON.stringify(pstats))); },
    setStats:function(d){ pstats=Object.assign(pstats,d||{}); wr(LSS,pstats); return Promise.resolve(); },
    incrementStats:function(d){
      Object.keys(d||{}).forEach(function(k){ pstats[k]=(+pstats[k]||0)+(+d[k]||0); });
      wr(LSS,pstats); return Promise.resolve(JSON.parse(JSON.stringify(pstats)));
    },
    signIn:function(){ return Promise.reject(new Error("no auth")); }
  };

  var yleaderboards={
    getLeaderboardDescription:function(n){
      return Promise.resolve({ name:n, "default":true, title:{}, entry_style:{},
        description:{ invert_sort_order:false, score_format:{ type:"numeric", options:{ decimal_offset:0 } }, type:"numeric" } });
    },
    setLeaderboardScore:function(){ return Promise.resolve(); },
    getLeaderboardPlayerEntry:function(){ return Promise.reject(new Error("no entry")); },
    getLeaderboardEntries:function(){ return Promise.resolve({ leaderboard:{}, ranges:[], userRank:0, entries:[] }); }
  };

  var ysdkLocal={
    environment:{ app:{ id:"0" }, browser:{ lang:LANG }, i18n:{ lang:LANG, tld:"com" }, payload:null, isTelegram:false },
    deviceInfo:{
      type:isMobile?"mobile":"desktop",
      isMobile:function(){ return isMobile; },
      isDesktop:function(){ return !isMobile; },
      isTablet:function(){ return false; },
      isTV:function(){ return false; }
    },
    adv:{
      showFullscreenAdv:function(o){ cb(o,"onOpen"); setTimeout(function(){ cb(o,"onClose",false); },300); },
      showRewardedVideo:function(o){
        cb(o,"onOpen");
        setTimeout(function(){ cb(o,"onRewarded"); setTimeout(function(){ cb(o,"onClose"); },120); },400);
      },
      showBannerAdv:function(){ return Promise.resolve({ stickyAdvIsShowing:false, reason:"UNKNOWN" }); },
      hideBannerAdv:function(){ return Promise.resolve({ stickyAdvIsShowing:false }); },
      getBannerAdvStatus:function(){ return Promise.resolve({ stickyAdvIsShowing:false, reason:"UNKNOWN" }); }
    },
    features:{ LoadingAPI:{ ready:function(){} }, GameplayAPI:{ start:function(){}, stop:function(){} } },
    screen:{
      fullscreen:{
        get status(){ return document.fullscreenElement ? "on" : "off"; },
        request:function(){ try{ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }catch(e){} return Promise.resolve(); },
        exit:function(){ try{ if(document.exitFullscreen) document.exitFullscreen(); }catch(e){} return Promise.resolve(); }
      }
    },
    feedback:{
      canReview:function(){ return Promise.resolve({ value:false, reason:"NO_AUTH" }); },
      requestReview:function(){ return Promise.resolve({ feedbackSent:false }); }
    },
    shortcut:{
      canShowPrompt:function(){ return Promise.resolve({ canShow:false }); },
      showPrompt:function(){ return Promise.resolve({ outcome:"rejected" }); }
    },
    clipboard:{ writeText:function(t){ try{ return navigator.clipboard.writeText(t); }catch(e){ return Promise.resolve(); } } },
    auth:{ openAuthDialog:function(){ return Promise.reject(new Error("no auth")); } },
    getPlayer:function(){ return Promise.resolve(yplayer); },
    getLeaderboards:function(){ return Promise.resolve(yleaderboards); },
    getPayments:function(){ return Promise.reject(new Error("payments unavailable")); },
    getFlags:function(){ return Promise.resolve({}); },
    getStorage:function(){ return Promise.resolve(window.localStorage); },
    isAvailableMethod:function(){ return Promise.resolve(false); },
    dispatchEvent:function(){ return Promise.resolve(); },
    onEvent:function(){ return function(){}; },
    on:function(){ return function(){}; },
    off:function(){},
    EVENT:{ EXIT:"EXIT", HISTORY_BACK:"HISTORY_BACK" },
    exit:function(){ return Promise.resolve(); }
  };

  function deep(){
    var fn=function(){ return Promise.resolve(true); };
    return new Proxy(fn,{
      get:function(t,p){
        if(p==="then"||p==="catch"||p==="finally") return undefined;
        if(p===Symbol.toPrimitive) return function(){ return 0; };
        if(p==="toString") return function(){ return ""; };
        return deep();
      },
      apply:function(){ return Promise.resolve(true); }
    });
  }
  var proxied=new Proxy(ysdkLocal,{
    get:function(t,p){
      if(p==="then"||p==="catch"||p==="finally") return undefined;
      if(p in t) return t[p];
      if(typeof p==="symbol") return undefined;
      return deep();
    }
  });

  window.YaGames={ init:function(){ return Promise.resolve(proxied); } };
  window.ysdk = proxied;
  window.ysdkLang = LANG;
})();
document.write('<scr'+'ipt src="' + U("sdkgon.js") + '"><\/scr'+'ipt>');
</script>
</head>
<body>
<main id="game-shell" aria-label="Game area">
<canvas id="unity-canvas" tabindex="-1"></canvas>
<section id="gate" aria-live="polite">
<div class="gate-panel">
<p id="status">Loading…</p>
<div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
<div id="progress-bar"></div>
</div>
<button id="start-button" type="button">START</button>
<p id="error"></p>
</div>
</section>
</main>
<script>
    (() => {
      "use strict";
      const canvas = document.getElementById("unity-canvas");
      const shell = document.getElementById("game-shell");
      const gate = document.getElementById("gate");
      const status = document.getElementById("status");
      const progressTrack = document.getElementById("progress-track");
      const progressBar = document.getElementById("progress-bar");
      const startButton = document.getElementById("start-button");
      const errorText = document.getElementById("error");
      let unityInstance = null;
      let started = false;

      window.SdkGon = window.SdkGon || {};
      ["init", "notifyGameLoaded", "pauseAudio", "gameReady", "markUserActivated", "gameplayStart", "gameplayStop"]
        .forEach(name => {
          if (typeof SdkGon[name] !== "function") SdkGon[name] = () => Promise.resolve();
        });
      if (typeof SdkGon.getLanguage !== "function") SdkGon.getLanguage = () => LANG;

      function guard(value, ms, fallback) {
        return Promise.race([
          Promise.resolve(value).catch(() => fallback),
          new Promise(resolve => setTimeout(() => resolve(fallback), ms))
        ]);
      }

      const strings = {
        ru: { loading: "Загрузка…", start: "СТАРТ", error: "Не удалось запустить игру. Обновите страницу." },
        en: { loading: "Loading…", start: "START", error: "The game could not start. Please reload the page." }
      };
      function languagePack() {
        const language = String(SdkGon.getLanguage() || LANG).toLowerCase();
        return language.startsWith("ru") ? strings.ru : strings.en;
      }
      function applyLanguage() {
        document.documentElement.lang = SdkGon.getLanguage() || LANG;
        const copy = languagePack();
        status.textContent = copy.loading;
        startButton.textContent = copy.start;
        errorText.textContent = copy.error;
      }
      function updateProgress(value) {
        const percent = Math.max(0, Math.min(100, Math.round(value * 100)));
        progressBar.style.width = `${percent}%`;
        progressTrack.setAttribute("aria-valuenow", String(percent));
      }
      function fail(error) {
        console.error("[game] Startup failed", error);
        applyLanguage();
        gate.classList.add("failed");
      }

      const buildUrl = U("Build");
      let mergedParts = 0;
      const totalParts = DATA_PARTS + WASM_PARTS;

      async function mergeParts(name, count, mime) {
        const chunks = [];
        let total = 0;
        for (let i = 0; i < count; i++) {
          const response = await fetch(`${buildUrl}/${name}.part${i}`);
          if (!response.ok) throw new Error(`${name}.part${i} ${response.status}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          chunks.push(bytes);
          total += bytes.length;
          mergedParts++;
          updateProgress((mergedParts / totalParts) * 0.4);
        }
        const merged = new Uint8Array(total);
        let offset = 0;
        for (const chunk of chunks) { merged.set(chunk, offset); offset += chunk.length; }
        return URL.createObjectURL(new Blob([merged], { type: mime }));
      }

      async function prepareFiles() {
        const codeUrl = await mergeParts("13.wasm", WASM_PARTS, "application/wasm");
        const dataUrl = await mergeParts("13.data", DATA_PARTS, "application/octet-stream");
        return { codeUrl, dataUrl };
      }

      function loadUnity(files) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = `${buildUrl}/13.loader.js`;
          script.onload = () => {
            const config = {
              dataUrl: files.dataUrl,
              frameworkUrl: `${buildUrl}/13.webaudio.framework.js`,
              codeUrl: files.codeUrl,
              streamingAssetsUrl: U("StreamingAssets"),
              companyName: "Game",
              productName: "Game",
              productVersion: "0.1.3",
              autoSyncPersistentDataPath: true,
              matchWebGLToCanvasSize: true,
              devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
            };
            createUnityInstance(canvas, config, p => updateProgress(0.4 + p * 0.6)).then(resolve).catch(reject);
          };
          script.onerror = () => reject(new Error("Unity loader is unavailable"));
          document.body.appendChild(script);
        });
      }

      async function boot() {
        try {
          applyLanguage();
          await guard(SdkGon.init(), 8000, null);
          applyLanguage();
          const files = await prepareFiles();
          unityInstance = await loadUnity(files);
          window.unityGame = unityInstance;
          try { SdkGon.notifyGameLoaded(); } catch (e) {}
          await guard(SdkGon.pauseAudio(), 3000, null);
          gate.classList.add("ready");
          startButton.focus({ preventScroll: true });
          await guard(SdkGon.gameReady(), 5000, null);
        } catch (error) {
          fail(error);
        }
      }

      async function startGame() {
        if (started || !unityInstance) return;
        started = true;
        startButton.disabled = true;
        try { SdkGon.markUserActivated(); } catch (e) {}
        try { SdkGon.gameplayStart(); } catch (e) {}
        canvas.style.visibility = "visible";
        gate.style.opacity = "0";
        window.setTimeout(() => {
          gate.hidden = true;
          canvas.focus({ preventScroll: true });
          window.dispatchEvent(new Event("resize"));
        }, 280);
      }

      shell.addEventListener("contextmenu", event => event.preventDefault());
      shell.addEventListener("selectstart", event => event.preventDefault());
      shell.addEventListener("dragstart", event => event.preventDefault());
      startButton.addEventListener("click", startGame, { once: true });
      window.addEventListener("load", boot, { once: true });
    })();
  </script>
</body>
</html>
